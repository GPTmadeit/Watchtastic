name: Release

# Publishing is driven by a tag, so cutting a release is always a deliberate act.
# The in-app updater reads published releases, meaning anything landing here reaches
# real watches — there is no accidental path to that.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.5.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Signing material never lives in the repo. Publishing an unsigned APK would be
      # worse than publishing nothing — Android rejects it with
      # INSTALL_PARSE_FAILED_NO_CERTIFICATES — so without secrets this skips the
      # publishing half rather than failing the run. Releases can still be cut by hand
      # with `gh release create`; see docs/RELEASING.md.
      - name: Check for signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not configured, so no APK was published. \
            Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to enable \
            automated releases — see docs/RELEASING.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore signing keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Assemble signed release APK
        if: steps.signing.outputs.configured == 'true'
        run: ./gradlew assembleRelease --stacktrace

      # A signed-looking APK that isn't actually signed is the failure mode worth
      # catching here, so verification is a hard gate before anything is published.
      - name: Verify the APK is actually signed
        if: steps.signing.outputs.configured == 'true'
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "Verifying $APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Generate checksum
        if: steps.signing.outputs.configured == 'true'
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          sha256sum "$APK" | awk -v n="$(basename "$APK")" '{print $1"  "n}' > "$APK.sha256"
          cat "$APK.sha256"

      - name: Remove signing material
        if: always()
        run: rm -f release.jks keystore.properties

      - name: Publish release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.apk.sha256
